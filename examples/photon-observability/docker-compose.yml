# mandor + photon (sister project): with a single config key, mandor pushes
# incidents, per-process + node metrics, and lifecycle events to photon over
# OTLP (no collector), and a shared volume persists crash history across
# container restarts. mandor stays offline until `photon` is set. To also report
# the host + GPU (superseding a standalone node agent), mount /proc, /sys,
# /etc/machine-id (and /dev/nvidia* for GPU) into `app` — GPU metrics are
# auto-detected (no toggle: on when a device is present, off otherwise).
services:
  app:
    build: .            # image ENTRYPOINT: ["/mandor", "--config=/mandor.toml"]
    volumes:
      - mandor-state:/var/lib/mandor
    environment:
      - PHOTON_OTLP_TOKEN=${PHOTON_OTLP_TOKEN}   # relay sends Authorization: Bearer …
      - MANDOR_RELEASE=app@1.4.2       # groups incidents by deploy

  photon:
    image: ghcr.io/nevindra/photon:latest
    ports: ["8080:8080"]

volumes:
  mandor-state:
# mandor.toml inside the app image:
#   max_restarts = 3
#   photon       = "photon:4318"
#   workers      = ["./api --port 3000", "./worker"]
#   # service_prefix = "tenant-a-"     # tag service.name per origin (multi-tenant photon)
#   # GPU metrics auto-detect (NVIDIA/AMD/Intel) when a device + /dev/nvidia* is present
#   # a curated warn/error digest ships to /v1/logs by default when photon= is set
#   # [worker.api]  stream  = true     # opt-in FULL per-line streaming for one worker
