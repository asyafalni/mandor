# mandor + photon (sister project): with a single config key, mandor pushes
# incidents, per-process metrics, lifecycle events and a warn/error digest to
# photon over OTLP (no collector), and a shared volume persists crash history
# across container restarts. mandor stays offline until `photon` is set. It
# reports only its workers: the host (and each worker's GPU share) is
# photon-agent's, running on the host.
services:
  app:
    build: .            # image ENTRYPOINT: ["/mandor", "--config=/mandor.toml"]
    volumes:
      - mandor-state:/var/lib/mandor
    environment:
      - PHOTON_INGEST_TOKEN=${PHOTON_INGEST_TOKEN}   # relay sends Authorization: Bearer …
      - MANDOR_RELEASE=app@1.4.2       # groups incidents by deploy

  photon:
    image: ghcr.io/nevindra/photon:latest
    ports: ["8080:8080"]

volumes:
  mandor-state:
# mandor.toml inside the app image:
#   max_restarts = 3
#   photon       = "photon:4318"
#   workers      = ["./api --port 3000", "./worker"]
#   # service_prefix = "tenant-a-"     # tag service.name per origin (multi-tenant photon)
#   # a curated warn/error digest ships to /v1/logs by default when photon= is set
#   # [worker.api]  stream  = true     # opt-in FULL per-line streaming for one worker
